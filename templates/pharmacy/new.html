{% extends "base.html" %}
{% block title %}Add inventory item{% endblock %}
{% block content %}
<h1>Add inventory item</h1>
<div class="panel">
  <form method="post">
    <label>Name *</label>
    <input type="text" name="name" required autofocus>
    <div class="row">
      <div><label>Type</label>
        <select name="item_type"><option value="drug">Drug</option><option value="material">Material / consumable</option></select>
      </div>
      <div><label>Unit</label><input type="text" name="unit" value="unit"></div>
    </div>
    <div class="row">
      <div><label>Unit price ({{ clinic.currency or 'UGX' }})</label><input type="number" step="0.01" name="unit_price" value="0"></div>
      <div><label>Stock quantity</label><input type="number" step="0.01" name="stock_qty" value="0"></div>
      <div><label>Reorder threshold</label><input type="number" step="0.01" name="reorder_threshold" value="0"></div>
    </div>
    <label>Expiry date</label>
    <input type="date" name="expiry_date">
    <button type="submit">Add item</button>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Edit {{ item.name }}{% endblock %}
{% block content %}
<h1>Edit {{ item.name }}</h1>
<div class="panel">
  <form method="post">
    <label>Name *</label>
    <input type="text" name="name" value="{{ item.name }}" required>
    <div class="row">
      <div><label>Type</label>
        <select name="item_type">
          <option value="drug" {{ 'selected' if item.item_type=='drug' }}>Drug</option>
          <option value="material" {{ 'selected' if item.item_type=='material' }}>Material / consumable</option>
        </select>
      </div>
      <div><label>Unit</label><input type="text" name="unit" value="{{ item.unit }}"></div>
    </div>
    <div class="row">
      <div><label>Unit price ({{ clinic.currency or 'UGX' }})</label><input type="number" step="0.01" name="unit_price" value="{{ item.unit_price }}"></div>
      <div><label>Stock quantity</label><input type="number" step="0.01" name="stock_qty" value="{{ item.stock_qty }}"></div>
      <div><label>Reorder threshold</label><input type="number" step="0.01" name="reorder_threshold" value="{{ item.reorder_threshold }}"></div>
    </div>
    <label>Expiry date</label>
    <input type="date" name="expiry_date" value="{{ item.expiry_date or '' }}">
    <button type="submit">Save changes</button>
  </form>
</div>
{% endblock %}
